name: Scheduled verification

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      extension_host_only:
        description: Run only the macOS Extension Host diagnostic
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.extension_host_only != true }}
    uses: ./.github/workflows/verify.yml

  scheduled-macos:
    if: ${{ always() && (inputs.extension_host_only == true || needs.verify.result == 'success') }}
    name: scheduled-macos
    needs: verify
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify conversation source identity
        run: npm run test-compile && node --test tests/platform/macos/conversationSources.test.js
      - name: Run stable Extension Host smoke
        run: npm run test:extension-host
