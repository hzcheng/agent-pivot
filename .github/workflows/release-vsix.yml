name: Release Agent Pivot VSIX

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release. Leave empty to use package.json."
        required: false
        type: string
      draft:
        description: "Create the GitHub release as a draft."
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub release as a prerelease."
        required: false
        default: false
        type: boolean
      publish_marketplace:
        description: "Publish to the VS Code Marketplace even when only the patch digit changed."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release-extension-host:
    name: release-extension-host
    needs: verify
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Resolve release source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          requested_version="${{ inputs.version }}"
          trigger_ref_type="${{ github.ref_type }}"
          trigger_ref_name="${{ github.ref_name }}"
          workflow_version="$(node -p "require('./package.json').version")"

          if [[ -n "$requested_version" && "$requested_version" != "$workflow_version" ]]; then
            echo "Requested version $requested_version does not match package.json version $workflow_version." >&2
            exit 1
          fi

          version="${requested_version:-$workflow_version}"
          tag="v${version}"
          if [[ "$trigger_ref_type" == "tag" && "$trigger_ref_name" != "$tag" ]]; then
            echo "Tag $trigger_ref_name does not match the requested release version $version." >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            ref="refs/tags/$tag"
          else
            ls_remote_status="$?"
            if [[ "$ls_remote_status" -ne 2 ]]; then
              echo "Unable to resolve release tag $tag from origin." >&2
              exit 1
            elif [[ "$trigger_ref_type" == "tag" ]]; then
              echo "Release tag $tag is not available from origin." >&2
              exit 1
            else
              ref="${{ github.sha }}"
            fi
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
      - name: Install dependencies
        run: npm ci
      - name: Install and activate release VSIX files
        run: npm run test:extension-host

  release:
    name: Build and release VSIX
    needs:
      - verify
      - release-extension-host
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      vsix_file: ${{ steps.meta.outputs.vsix_file }}
      bridge_vsix_file: ${{ steps.meta.outputs.bridge_vsix_file }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve release source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          requested_version="${{ inputs.version }}"
          trigger_ref_type="${{ github.ref_type }}"
          trigger_ref_name="${{ github.ref_name }}"
          workflow_version="$(node -p "require('./package.json').version")"

          if [[ -n "$requested_version" && "$requested_version" != "$workflow_version" ]]; then
            echo "Requested version $requested_version does not match package.json version $workflow_version." >&2
            echo "Run the workflow from the release version's current branch instead." >&2
            exit 1
          fi

          version="${requested_version:-$workflow_version}"
          tag="v${version}"

          if [[ "$trigger_ref_type" == "tag" && "$trigger_ref_name" != "$tag" ]]; then
            echo "Tag $trigger_ref_name does not match the requested release version $version." >&2
            echo "Expected tag: $tag" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            ref="refs/tags/$tag"
            source_ref="$tag"
          else
            ls_remote_status="$?"
            if [[ "$ls_remote_status" -ne 2 ]]; then
              echo "Unable to resolve release tag $tag from origin." >&2
              exit 1
            elif [[ "$trigger_ref_type" == "tag" ]]; then
              echo "Release tag $tag is not available from origin." >&2
              exit 1
            else
              ref="${{ github.sha }}"
              source_ref="$ref"
            fi
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          publisher="$(node -p "require('./package.json').publisher")"
          bridge_name="$(node -p "require('./extensions/attention-ui-bridge/package.json').name")"
          bridge_version="$(node -p "require('./extensions/attention-ui-bridge/package.json').version")"
          bridge_publisher="$(node -p "require('./extensions/attention-ui-bridge/package.json').publisher")"
          tag="${{ steps.source.outputs.tag }}"
          version="${tag#v}"
          source_sha="$(git rev-parse HEAD)"

          if [[ "$tag" != "v$package_version" ]]; then
            echo "Release source package.json version $package_version does not match $tag." >&2
            exit 1
          fi

          vsix_file="artifacts/${package_name}-${version}.vsix"
          bridge_vsix_file="artifacts/${bridge_name}-${bridge_version}.vsix"

          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publisher=$publisher" >> "$GITHUB_OUTPUT"
          echo "bridge_name=$bridge_name" >> "$GITHUB_OUTPUT"
          echo "bridge_version=$bridge_version" >> "$GITHUB_OUTPUT"
          echo "bridge_publisher=$bridge_publisher" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "vsix_file=$vsix_file" >> "$GITHUB_OUTPUT"
          echo "bridge_vsix_file=$bridge_vsix_file" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Verify release notes
        run: npm run test:release-notes

      - name: Compile
        run: npm run test-compile && npm run attention:bridge:compile

      - name: Lint
        run: npm run lint

      - name: Package and verify release VSIX files
        run: npm run test:release-packaging

      - name: Write package summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## VSIX files"
            echo
            echo "| Extension | Version | File | SHA-256 |"
            echo "| --- | --- | --- | --- |"
            echo "| ${{ steps.meta.outputs.bridge_publisher }}.${{ steps.meta.outputs.bridge_name }} | ${{ steps.meta.outputs.bridge_version }} | ${{ steps.meta.outputs.bridge_vsix_file }} | $(sha256sum "${{ steps.meta.outputs.bridge_vsix_file }}" | awk '{print $1}') |"
            echo "| ${{ steps.meta.outputs.publisher }}.${{ steps.meta.outputs.package_name }} | ${{ steps.meta.outputs.version }} | ${{ steps.meta.outputs.vsix_file }} | $(sha256sum "${{ steps.meta.outputs.vsix_file }}" | awk '{print $1}') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-pivot-${{ steps.meta.outputs.version }}-vsix
          path: |
            ${{ steps.meta.outputs.bridge_vsix_file }}
            ${{ steps.meta.outputs.vsix_file }}
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          MAIN_VSIX_FILE: ${{ steps.meta.outputs.vsix_file }}
          BRIDGE_VSIX_FILE: ${{ steps.meta.outputs.bridge_vsix_file }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; retaining it."
          else
            args=()
            if [[ "$DRAFT" == "true" ]]; then
              args+=(--draft)
            fi
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi

            node scripts/extract-release-notes.js "$VERSION" > release-notes.md

            gh release create "$TAG" --target "$SOURCE_SHA" \
              --title "Agent Pivot ${VERSION}" \
              --notes-file release-notes.md \
              "${args[@]}"
          fi

          gh release upload "$TAG" "$BRIDGE_VSIX_FILE" "$MAIN_VSIX_FILE" --clobber

  publish-marketplace:
    name: publish-marketplace
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Decide marketplace publish
        id: decision
        env:
          FORCE_PUBLISH: ${{ inputs.publish_marketplace }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          version="$RELEASE_VERSION"
          current_tag="v${version}"
          previous_tag="$(git tag --list 'v*.*.*' --sort=-version:refname | grep -vx "$current_tag" | head -n 1 || true)"

          publish="false"
          if [[ "$FORCE_PUBLISH" == "true" ]]; then
              publish="true"
              reason="forced by the publish_marketplace workflow input"
          elif [[ -z "$previous_tag" ]]; then
              publish="true"
              reason="no earlier release tag found; treating ${current_tag} as the first marketplace release"
          else
              previous_major_minor="${previous_tag#v}"
              previous_major_minor="${previous_major_minor%.*}"
              current_major_minor="${version%.*}"
              if [[ "$previous_major_minor" != "$current_major_minor" ]]; then
                  publish="true"
                  reason="minor or major bump ${previous_tag} -> ${current_tag}"
              else
                  reason="patch-only bump ${previous_tag} -> ${current_tag}; the marketplace keeps the previous minor line"
              fi
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "$reason"

      - name: Check marketplace credentials
        id: credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          if [[ -n "${VSCE_PAT:-}" ]]; then
              echo "configured=true" >> "$GITHUB_OUTPUT"
          else
              echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Handle missing marketplace credentials
        if: steps.decision.outputs.publish == 'true' && steps.credentials.outputs.configured == 'false'
        env:
          FORCE_PUBLISH: ${{ inputs.publish_marketplace }}
        shell: bash
        run: |
          if [[ "$FORCE_PUBLISH" == "true" ]]; then
              echo "::error::publish_marketplace was requested but the VSCE_PAT secret is not configured on this repository." >&2
              exit 1
          fi
          echo "::warning::Skipping marketplace publish: the VSCE_PAT secret is not configured. Create an Azure DevOps PAT with the Marketplace > Manage scope for publisher hzcheng and store it as the VSCE_PAT repository secret."

      - name: Record marketplace skip
        if: steps.decision.outputs.publish == 'false'
        shell: bash
        run: |
          echo "::notice::${{ steps.decision.outputs.reason }}"

      - name: Download release VSIX artifact
        if: steps.decision.outputs.publish == 'true' && steps.credentials.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: agent-pivot-${{ needs.release.outputs.version }}-vsix
          path: artifacts

      - name: Publish extensions to the VS Code Marketplace
        if: steps.decision.outputs.publish == 'true' && steps.credentials.outputs.configured == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          BRIDGE_VSIX_FILE: ${{ needs.release.outputs.bridge_vsix_file }}
          VSIX_FILE: ${{ needs.release.outputs.vsix_file }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @vscode/vsce publish --packagePath "$BRIDGE_VSIX_FILE" --pat "$VSCE_PAT" --allow-star-activation --skip-duplicate
          npx --yes @vscode/vsce publish --packagePath "$VSIX_FILE" --pat "$VSCE_PAT" --allow-star-activation --skip-duplicate

      - name: Write marketplace publish summary
        if: always()
        env:
          REASON: ${{ steps.decision.outputs.reason }}
          PUBLISH: ${{ steps.decision.outputs.publish }}
          CREDENTIALS: ${{ steps.credentials.outputs.configured }}
        shell: bash
        run: |
          {
            echo "## Marketplace publish"
            echo
            echo "- Decision: ${REASON}"
            echo "- Publish requested: ${PUBLISH}"
            echo "- VSCE_PAT configured: ${CREDENTIALS}"
          } >> "$GITHUB_STEP_SUMMARY"
