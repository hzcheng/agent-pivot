name: Merge approval gate

on:
  # pull_request_target: the workflow AND the gate code always come from the
  # default branch (round-2 review Blocker 1). The gate reads the PR head as
  # data only — it never checks the head out over the workspace and never
  # executes head code, so a PR cannot approve itself by editing the gate.
  pull_request_target:
    # edited: declaration blocks bind the head SHA and are re-evaluated when
    # the body changes.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The gate regenerates the architecture impact report for the PR
          # base..head range and checks out the exact head being evaluated,
          # so it needs full history.
          fetch-depth: 0
      - name: Evaluate and post the merge-approval status
        run: node scripts/run-merge-approval-gate.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
