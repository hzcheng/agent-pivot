  <script>
    (function () {
      var root = document.getElementById('agent-pivot-ai-final');
      var tabs = root.querySelectorAll('[data-tab]');
      var pages = root.querySelectorAll('[data-page]');
      var menus = root.querySelectorAll('[data-menu]');
      tabs.forEach(function (tab) { tab.addEventListener('click', function () {
        var page = tab.getAttribute('data-tab');
        tabs.forEach(function (item) { var active = item === tab; item.classList.toggle('active', active); item.setAttribute('aria-selected', active ? 'true' : 'false'); });
        pages.forEach(function (item) { item.hidden = item.getAttribute('data-page') !== page; });
        menus.forEach(function (menu) { menu.hidden = true; });
      }); });
      root.querySelectorAll('[data-add]').forEach(function (button) { button.addEventListener('click', function () {
        var menu = root.querySelector('[data-menu="' + button.getAttribute('data-add') + '"]');
        var open = menu.hidden;
        menus.forEach(function (item) { item.hidden = true; });
        menu.hidden = !open;
      }); });
      root.querySelectorAll('[data-collapse]').forEach(function (button) { button.addEventListener('click', function () {
        var key = button.getAttribute('data-collapse');
        var children = root.querySelector('[data-children="' + key + '"]');
        var expanded = button.getAttribute('aria-expanded') === 'true';
        button.setAttribute('aria-expanded', expanded ? 'false' : 'true');
        button.textContent = expanded ? '▸' : '▾';
        button.setAttribute('aria-label', (expanded ? 'Expand ' : 'Collapse ') + button.parentNode.querySelector('.group-main').textContent.trim());
        children.hidden = expanded;
      }); });
      var library = root.querySelector('[data-library]');
      var project = root.querySelector('[data-project]');
      root.querySelectorAll('[data-scope]').forEach(function (button) { button.addEventListener('click', function () {
        var isProject = button.getAttribute('data-scope') === 'project';
        root.querySelectorAll('[data-scope]').forEach(function (item) { item.classList.toggle('active', item === button); });
        library.hidden = isProject; project.hidden = !isProject;
        root.querySelector('[data-scope-label]').textContent = isProject ? 'Workspace access' : 'Global assets';
      }); });
      root.querySelectorAll('.switch').forEach(function (button) { button.addEventListener('click', function (event) { event.stopPropagation(); button.classList.toggle('on'); }); });
    }());
  </script>
