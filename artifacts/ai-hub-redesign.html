<div id="ai-hub-sidebar" aria-label="AI Hub sidebar redesign">
  <style>
    #ai-hub-sidebar { max-width:340px; color:light-dark(#202938,#e6edf3); font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    #ai-hub-sidebar * { box-sizing:border-box; }
    #ai-hub-sidebar .surface { overflow:hidden; border:1px solid light-dark(#d9dee5,#303946); border-radius:8px; background:light-dark(#fff,#1d232d); box-shadow:0 10px 24px rgba(0,0,0,.15); }
    #ai-hub-sidebar .top { padding:12px 12px 0; border-bottom:1px solid light-dark(#e2e6eb,#303946); }
    #ai-hub-sidebar .topline, #ai-hub-sidebar .subline, #ai-hub-sidebar .workflow-title { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    #ai-hub-sidebar .topline { margin-bottom:11px; font-size:15px; font-weight:600; }
    #ai-hub-sidebar .meta { color:light-dark(#687386,#9da8b7); font-size:11px; font-weight:400; }
    #ai-hub-sidebar button { border:0; color:inherit; background:transparent; font:inherit; cursor:pointer; }
    #ai-hub-sidebar .new { padding:5px 8px; border-radius:5px; color:#fff; background:light-dark(#2563eb,#238636); font-size:12px; }
    #ai-hub-sidebar .tabs { display:flex; gap:13px; }
    #ai-hub-sidebar .tabs button { padding:0 1px 8px; border-bottom:2px solid transparent; color:light-dark(#6b7585,#aab5c4); font-size:12px; }
    #ai-hub-sidebar .tabs button.active { border-bottom-color:light-dark(#2563eb,#58a6ff); color:light-dark(#1f2937,#f2f5f8); font-weight:600; }
    #ai-hub-sidebar .page { padding:10px; }
    #ai-hub-sidebar .page[hidden] { display:none; }
    #ai-hub-sidebar .nav-row, #ai-hub-sidebar .item { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px; width:100%; min-height:40px; padding:7px 8px; border-bottom:1px solid light-dark(#edf0f3,#29313d); text-align:left; }
    #ai-hub-sidebar .nav-row:first-of-type, #ai-hub-sidebar .item:first-of-type { border-top:1px solid light-dark(#edf0f3,#29313d); }
    #ai-hub-sidebar .nav-row:hover, #ai-hub-sidebar .item:hover { background:light-dark(#f5f8fd,#253142); }
    #ai-hub-sidebar .item { grid-template-columns:22px minmax(0,1fr) auto; }
    #ai-hub-sidebar .name { display:block; overflow:hidden; font-weight:600; text-overflow:ellipsis; white-space:nowrap; }
    #ai-hub-sidebar .desc { display:block; overflow:hidden; color:light-dark(#748092,#9da8b7); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    #ai-hub-sidebar .count, #ai-hub-sidebar .chevron { color:light-dark(#6d7787,#aab5c4); font-size:11px; }
    #ai-hub-sidebar .section { padding:11px 2px 5px; color:light-dark(#687386,#9da8b7); font-size:10px; font-weight:700; letter-spacing:.07em; }
    #ai-hub-sidebar .back { padding:2px 0 8px; color:light-dark(#2563eb,#58a6ff); font-size:12px; }
    #ai-hub-sidebar .workflow-title { padding:1px 0 9px; }
    #ai-hub-sidebar .step { display:grid; width:21px; height:21px; place-items:center; border-radius:50%; color:light-dark(#2563eb,#83c1ff); background:light-dark(#e8f0ff,#203a58); font-size:11px; font-weight:700; }
    #ai-hub-sidebar .more { padding:4px; color:light-dark(#637083,#b0bdcc); }
    #ai-hub-sidebar .skills-head { display:flex; align-items:center; justify-content:space-between; padding-bottom:8px; }
    #ai-hub-sidebar .segmented { display:inline-flex; padding:2px; border:1px solid light-dark(#dbe0e6,#394351); border-radius:5px; }
    #ai-hub-sidebar .segmented button { padding:3px 6px; border-radius:3px; color:light-dark(#697485,#aab5c4); font-size:11px; }
    #ai-hub-sidebar .segmented button.active { color:light-dark(#1f2937,#f2f5f8); background:light-dark(#f2f5f9,#303a47); font-weight:600; }
    #ai-hub-sidebar .agent { color:light-dark(#627084,#aab5c4); font-size:10px; white-space:nowrap; }
    #ai-hub-sidebar .warn { color:light-dark(#9a5907,#edb659); font-size:11px; white-space:nowrap; }
  </style>
  <div class="surface">
    <header class="top">
      <div class="topline"><span>AI Hub</span><button class="new" data-new-prompt type="button">New prompt</button></div>
      <nav class="tabs" aria-label="AI sections">
        <button class="active" data-tab="prompts" type="button">Prompts</button>
        <button data-tab="skills" type="button">Skills</button>
        <button type="button">MCP</button>
        <button type="button">Hooks</button>
      </nav>
    </header>
    <section class="page" data-page="prompts">
      <div data-prompt-home>
        <div class="section">WORKFLOWS</div>
        <button class="nav-row" data-open-workflow type="button"><span><span class="name">Feature · PR flow</span><span class="desc">Plan, implement, review</span></span><span class="count">3 ›</span></button>
        <button class="nav-row" type="button"><span><span class="name">Bug triage</span><span class="desc">Reproduce, diagnose</span></span><span class="count">2 ›</span></button>
        <button class="nav-row" type="button"><span><span class="name">Release note</span><span class="desc">Summarize, polish, publish</span></span><span class="count">3 ›</span></button>
        <div class="section">PROMPT LIBRARY <span class="meta">12 templates</span></div>
        <button class="nav-row" type="button"><span class="name">All prompts</span><span class="chevron">›</span></button>
        <button class="nav-row" type="button"><span class="name">Unfiled</span><span class="count">4 ›</span></button>
      </div>
      <div data-workflow-detail hidden>
        <button class="back" data-close-workflow type="button">← Workflows</button>
        <div class="workflow-title"><span><strong>Feature · PR flow</strong><span class="desc">3 ordered steps</span></span><button class="more" type="button" aria-label="Workflow actions">⋯</button></div>
        <button class="item" type="button"><span class="step">1</span><span><span class="name">Plan the feature</span><span class="desc">Architecture and acceptance criteria</span></span><span class="chevron">›</span></button>
        <button class="item" type="button"><span class="step">2</span><span><span class="name">Implement the change</span><span class="desc">Focused implementation prompt</span></span><span class="chevron">›</span></button>
        <button class="item" type="button"><span class="step">3</span><span><span class="name">Review and prepare PR</span><span class="desc">Checks, review, handoff</span></span><span class="chevron">›</span></button>
      </div>
    </section>
    <section class="page" data-page="skills" hidden>
      <div class="skills-head"><strong>Skills <span class="meta">18 available</span></strong><div class="segmented"><button class="active" type="button">Project</button><button type="button">Global</button></div></div>
      <div class="section">ENABLED</div>
      <button class="nav-row" type="button"><span><span class="name">fixing-regressions-with-ci</span><span class="desc">Test-first regression workflow</span></span><span class="agent">Codex · Claude</span></button>
      <button class="nav-row" type="button"><span><span class="name">publishing-and-merging-github-prs</span><span class="desc">PR gates and merge workflow</span></span><span class="agent">Codex</span></button>
      <div class="section">NEEDS ATTENTION</div>
      <button class="nav-row" type="button"><span><span class="name">frontend-design</span><span class="desc">A newer Global copy exists</span></span><span class="warn">Duplicate ›</span></button>
    </section>
  </div>
  <script>
    (function () {
      var root = document.getElementById('ai-hub-sidebar');
      var tabs = root.querySelectorAll('[data-tab]');
      var pages = root.querySelectorAll('[data-page]');
      tabs.forEach(function (tab) { tab.addEventListener('click', function () {
        var page = tab.getAttribute('data-tab');
        tabs.forEach(function (item) { item.classList.toggle('active', item === tab); });
        pages.forEach(function (item) { item.hidden = item.getAttribute('data-page') !== page; });
        root.querySelector('[data-new-prompt]').hidden = page !== 'prompts';
      }); });
      var home = root.querySelector('[data-prompt-home]');
      var detail = root.querySelector('[data-workflow-detail]');
      root.querySelector('[data-open-workflow]').addEventListener('click', function () { home.hidden = true; detail.hidden = false; });
      root.querySelector('[data-close-workflow]').addEventListener('click', function () { home.hidden = false; detail.hidden = true; });
      root.querySelectorAll('.segmented button').forEach(function (button) { button.addEventListener('click', function () {
        root.querySelectorAll('.segmented button').forEach(function (item) { item.classList.toggle('active', item === button); });
      }); });
    }());
  </script>
</div>
