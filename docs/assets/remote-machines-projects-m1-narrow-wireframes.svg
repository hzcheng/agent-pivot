<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">Remote Machines and Projects narrow-width wireframes</title>
  <desc id="desc">Low-fidelity sidebar layouts at 300 and 260 CSS pixels showing responsive toolbar, truncated labels, retained open actions, overflow menus and a focus outline.</desc>
  <defs>
    <style>
      .bg{fill:#1e1e1e}.panel{fill:#252526;stroke:#555}.bar{fill:#2d2d30}.field{fill:#313131;stroke:#666}.row{fill:#252526}.hover{fill:#37373d}.btn{fill:#333337;stroke:#777}.focus{fill:none;stroke:#75beff;stroke-width:2}.line{stroke:#505050}.t{fill:#e8e8e8;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.sm{fill:#c7c7c7;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.xs{fill:#aaa;font:10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{fill:#bbb;font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.7px}.head{fill:#eee;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.accent{fill:#75beff}.warn{fill:#d7ba7d}.note{fill:#d0d0d0;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.call{fill:#181818;stroke:#777}
    </style>
  </defs>
  <rect class="bg" width="760" height="760"/>
  <text class="head" x="36" y="34">NARROW WIDTH CONTRACT</text>
  <text class="xs" x="36" y="52">LOW-FIDELITY · CSS PIXELS · ALSO VERIFY AT 200% ZOOM</text>

  <g transform="translate(36 78)">
    <rect class="panel" width="300" height="620" rx="3"/>
    <rect class="bar" width="300" height="38" rx="3"/><text class="label" x="12" y="24">PROJECTS · 300PX</text><text class="sm" x="276" y="24">⋯</text>
    <rect class="field" x="8" y="48" width="284" height="30" rx="2"/><text class="sm" x="18" y="67">⌕  Search projects and machines…</text>
    <rect class="btn" x="8" y="88" width="76" height="26" rx="2"/><text class="sm" x="20" y="105">Tags (2)</text>
    <rect class="btn" x="238" y="88" width="54" height="26" rx="2"/><text class="sm" x="249" y="105">Add⌄</text>
    <line class="line" x1="0" y1="124" x2="300" y2="124"/>
    <text class="label" x="12" y="150">⌄ FAVORITES</text>
    <text class="t" x="24" y="177">★ agent-pivot</text><text class="xs" x="42" y="192">devbox-a › Host</text>
    <rect class="hover" x="0" y="210" width="300" height="38"/>
    <text class="t" x="12" y="234">⌄ ▣ <tspan font-weight="600">devbox-a</tspan></text><text class="xs" x="174" y="233">2 windows</text><text class="sm accent" x="253" y="233">↗</text><text class="sm" x="278" y="233">⋯</text>
    <text class="sm" x="30" y="274">⌄ ▤ Host</text><text class="sm" x="278" y="274">⋯</text>
    <text class="t" x="56" y="302">agent-pivot</text><text class="sm" x="278" y="302">⋯</text>
    <rect class="hover" x="0" y="318" width="300" height="46"/>
    <text class="t" x="12" y="340">› ▣ gpu-training-mach…</text><text class="sm accent" x="253" y="340">⚙</text><text class="sm" x="278" y="340">⋯</text>
    <text class="xs warn" x="31" y="356">Not configured in this VS Code</text>
    <rect class="call" x="18" y="408" width="264" height="106" rx="3"/>
    <text class="note" x="32" y="433">280–359px</text>
    <text class="sm" x="32" y="457">Search uses its own row.</text>
    <text class="sm" x="32" y="478">Add Project moves into …</text>
    <text class="sm" x="32" y="499">Status may use a second line.</text>
    <text class="label" x="12" y="594">W5 · 300PX</text>
  </g>

  <g transform="translate(420 78)">
    <rect class="panel" width="260" height="620" rx="3"/>
    <rect class="bar" width="260" height="38" rx="3"/><text class="label" x="12" y="24">PROJECTS · 260PX</text><text class="sm" x="236" y="24">⋯</text>
    <rect class="field" x="8" y="48" width="202" height="30" rx="2"/><text class="sm" x="18" y="67">⌕ Search…</text>
    <rect class="btn" x="216" y="48" width="36" height="30" rx="2"/><text class="sm" x="226" y="67">#2</text>
    <line class="line" x1="0" y1="88" x2="260" y2="88"/>
    <text class="label" x="12" y="114">⌄ FAVORITES</text>
    <text class="t" x="24" y="141">★ agent-pivot</text><text class="xs" x="42" y="156">devbox-a › Host</text>
    <rect class="hover" x="0" y="176" width="260" height="38"/>
    <text class="t" x="12" y="200">⌄ ▣ <tspan font-weight="600">devbox-a</tspan></text><text class="sm accent" x="213" y="199">↗</text><text class="sm" x="238" y="199">⋯</text>
    <rect class="focus" x="208" y="181" width="26" height="28" rx="2"/>
    <text class="sm" x="30" y="240">⌄ ▤ Host</text><text class="sm" x="238" y="240">⋯</text>
    <text class="t" x="56" y="268">agent-pivot</text><text class="sm" x="238" y="268">⋯</text>
    <rect class="hover" x="0" y="284" width="260" height="46"/>
    <text class="t" x="12" y="306">› ▣ gpu-training…</text><text class="sm accent" x="213" y="306">⚙</text><text class="sm" x="238" y="306">⋯</text>
    <text class="xs warn" x="31" y="322">Not configured</text>
    <rect class="call" x="16" y="374" width="228" height="126" rx="3"/>
    <text class="note" x="30" y="399">Below 280px</text>
    <text class="sm" x="30" y="423">Toolbar actions become icons.</text>
    <text class="sm" x="30" y="444">Name wins; tags/counts hide.</text>
    <text class="sm" x="30" y="465">Open and … always remain.</text>
    <text class="sm" x="30" y="486">Focus uses outline, not color only.</text>
    <text class="label" x="12" y="594">W6 · 260PX</text>
  </g>
</svg>
