name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-linux:
    name: quality-linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Chromium headless shell
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout --kill-after=10s 120s npx playwright install --only-shell chromium; then
              exit 0
            fi
            echo "::warning::Chromium install attempt ${attempt} failed"
          done
          exit 1
      - name: Run Linux quality gate
        run: npm run test:ci:linux
        env:
          COVERAGE_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
      - name: Check PR skill harvest section
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-body.js
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

  platform-windows:
    name: platform-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Windows platform gate
        run: npm run test:ci:windows

  tmux-smoke-linux:
    name: tmux-smoke-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install tmux
        run: sudo apt-get install -y tmux
      - name: Run isolated real-tmux smoke gate
        run: npm run test:tmux:smoke

  extension-host-linux:
    name: extension-host-linux
    # Advisory PR gate: real VS Code activation smoke, only when the command
    # surface or the harness itself changed. Not a required check yet.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect extension-host-relevant changes
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- \
              package.json \
              src/dashboard.ts \
              extensions \
              tests/extension-host \
              scripts/run-extension-host-tests.js \
              scripts/run-extension-host-worker.js \
              scripts/lib/extensionHostLauncher.js | grep -q .; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci
      - name: Install Xvfb
        if: steps.changes.outputs.relevant == 'true'
        run: sudo apt-get install -y xvfb
      - name: Run Extension Host smoke
        if: steps.changes.outputs.relevant == 'true'
        run: xvfb-run -a npm run test:extension-host

  merge-approval-audit:
    name: merge-approval-audit
    # Post-merge backstop: only meaningful on the default branch.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit recent merges for owner approval markers
        run: node scripts/run-merge-approval-audit.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
