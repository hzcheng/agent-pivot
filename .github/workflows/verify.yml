name: Verify

on:
  pull_request:
    # edited: the PR body conventions check (CID block, owner approvals)
    # binds the body text; editing the body must re-run the lane.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-metadata:
    name: pr-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check PR body conventions
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-body.js
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  static-preflight:
    name: static-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run static repository preflight
        run: |
          node scripts/check-brand-identity.js
          node scripts/check-behavior-contracts.js
          node --test tests/unit/tooling/conversationReleaseJourneys.test.js
          node scripts/check-conversation-release-journeys.js
          node scripts/run-performance-architecture-baseline-checks.js
          node scripts/run-release-notes-checks.js

  # The serial `npm run test:ci:linux` gate is sharded onto four runners so
  # wall-clock time approaches the slowest shard instead of the sum. Do not
  # run these checks concurrently inside one runner: test-compile cleans
  # out/, release packaging cleans its own output, and coverage/performance
  # runs fight over CPU.
  linux-core:
    name: linux-core
    needs: [pr-metadata, static-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # check-changed-coverage diffs against the PR base.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Linux core shard (compile, lint, coverage)
        run: npm run test:ci:linux:core
        env:
          COVERAGE_DIFF_BASE: ${{ github.event.pull_request.base.sha }}

  linux-browser:
    name: linux-browser
    needs: [pr-metadata, static-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Chromium headless shell
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout --kill-after=10s 120s npx playwright install --only-shell chromium; then
              exit 0
            fi
            echo "::warning::Chromium install attempt ${attempt} failed"
          done
          exit 1
      - name: Run Linux browser shard (browser, dashboard, performance)
        run: npm run test:ci:linux:browser

  linux-safety:
    name: linux-safety
    needs: [pr-metadata, static-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Linux safety shard (remote sources, safety, architecture)
        run: npm run test:ci:linux:safety

  linux-release:
    name: linux-release
    needs: [pr-metadata, static-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Linux release shard (brand, release notes, packaging)
        run: npm run test:ci:linux:release

  # Required-check aggregate: branch protection keeps pointing at
  # quality-linux. It must run even when a shard failed — a job skipped by a
  # failed `needs` entry reports success to branch protection — and then fail
  # explicitly on any non-success shard result.
  quality-linux:
    name: quality-linux
    needs: [linux-core, linux-browser, linux-safety, linux-release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aggregate Linux shard results
        run: node scripts/check-ci-shard-results.js
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}

  platform-windows:
    name: platform-windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Windows platform gate
        run: npm run test:ci:windows

  tmux-smoke-linux:
    name: tmux-smoke-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install tmux
        run: sudo apt-get install -y tmux
      - name: Run isolated real-tmux smoke gate
        run: npm run test:tmux:smoke

  extension-host-linux:
    name: extension-host-linux
    # Advisory PR gate: real VS Code activation smoke, only when the command
    # surface or the harness itself changed. Not a required check yet.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect extension-host-relevant changes
        id: changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- \
              package.json \
              src/dashboard.ts \
              extensions \
              tests/extension-host \
              scripts/run-extension-host-tests.js \
              scripts/run-extension-host-worker.js \
              scripts/lib/extensionHostLauncher.js | grep -q .; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Node
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci
      - name: Install Xvfb
        if: steps.changes.outputs.relevant == 'true'
        run: sudo apt-get install -y xvfb
      - name: Run Extension Host smoke
        if: steps.changes.outputs.relevant == 'true'
        run: xvfb-run -a npm run test:extension-host
